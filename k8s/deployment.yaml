apiVersion: v1
kind: Secret
metadata:
  name: student-db-secret
type: Opaque
stringData:
  username: root
  password: root
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: student-config
data:
  DB_URL: jdbc:mysql://student-mysql:3306/studentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-mysql
  template:
    metadata:
      labels:
        app: student-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: password
            - name: MYSQL_DATABASE
              value: studentdb
---
apiVersion: v1
kind: Service
metadata:
  name: student-mysql
spec:
  selector:
    app: student-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
        - name: app
          image: ghcr.io/YOUR-GITHUB-USERNAME/student-management-devops:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: student-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: student-management
spec:
  type: NodePort
  selector:
    app: student-management
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
