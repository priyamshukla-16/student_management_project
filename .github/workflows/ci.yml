name: Student Management CI/CD

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test-build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit tests
        run: mvn -B clean test

      - name: Maven package
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-management-${{ github.sha }}
          path: target/*.jar

      - name: Build Docker image
        run: docker build -t student-management-devops:${{ github.sha }} .

      - name: Trivy security scan
      uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: student-management-devops:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  publish-ghcr:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-build-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker build -t ghcr.io/${{ github.repository_owner }}/student-management-devops:${VERSION} .
          docker push ghcr.io/${{ github.repository_owner }}/student-management-devops:${VERSION}
