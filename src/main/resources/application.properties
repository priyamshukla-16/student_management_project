spring.application.name=student-management-devops

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://host.docker.internal:3306/studentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always